kind = "web"
previewPath = "/"
title = "Grudge GameForge"
version = "1.0.0"
id = "artifacts/game-forge"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24426

[services.development]
run = "pnpm --filter @workspace/game-forge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/game-forge", "run", "build" ]
publicDir = "artifacts/game-forge/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24426"
BASE_PATH = "/"
