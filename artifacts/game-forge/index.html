      rel="stylesheet"
    />
    <!--
      Modulepreload hints for the 3D viewport are injected at build time
      by the `preloadViewportCandidate` plugin in `vite.config.ts`. The
      plugin finds the bundled `viewportPreload` and `vendor-postprocessing`
      chunks and emits `<link rel="modulepreload">` tags here so the
      browser fetches them in parallel with the main entry — long before
      React reaches the lazy `<Viewport />` import in `App.tsx`. See
      `src/editor/viewportPreload.ts` for the re-export entry that anchors
      the chunk name and `src/lib/prefetch.ts` for the complementary
      idle-time prefetch.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
