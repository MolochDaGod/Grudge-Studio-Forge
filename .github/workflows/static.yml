# DEPRECATED: entire-repo upload was replaced by docs-only Jekyll Pages.
# See .github/workflows/pages.yml (just-the-docs under docs/).
#
# Kept disabled so we never re-upload secrets-adjacent monorepo roots to Pages.
name: Deploy static content to Pages (disabled)

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type ENABLE only if you intentionally need legacy full-repo Pages"
        required: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  disabled:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse legacy full-repo Pages
        run: |
          echo "Use workflow pages.yml (docs/ only). Legacy static.yml is disabled."
          if [ "${{ inputs.confirm }}" != "ENABLE" ]; then
            exit 1
          fi
          echo "Confirm received but legacy path is not implemented. Abort."
          exit 1
