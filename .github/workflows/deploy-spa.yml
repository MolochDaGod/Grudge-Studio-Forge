# Build the full game-forge SPA and deploy to Vercel production.
# Uses a temporary swap file so the Vite+Rollup graph fits on ubuntu-latest (~7 GB RAM).
name: Deploy Forge SPA

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-forge-spa
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build SPA · Deploy Vercel
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Enable swap (24G)
        run: |
          sudo swapoff -a || true
          sudo rm -f /swapfile
          sudo fallocate -l 24G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=24576
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          free -h
          # Drop caches so the Vite graph has room to grow
          sudo sh -c 'echo 3 > /proc/sys/vm/drop_caches' || true

      # Prefer package.json#packageManager; pin version as fallback when the
      # field is missing so setup never fails closed on a bare package.json.
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
          run_install: false

      # cache: pnpm + lockfile path — store must be default (see root .npmrc).
      # A committed Windows store-dir made the setup-node post-step fail red
      # even after a successful deploy.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install game-forge graph
        run: pnpm install --no-frozen-lockfile --filter "@workspace/game-forge..."

      # Skip player prebuild here (player package not fully installed with the
      # game-forge filter; SPA build uses vite exec and does not need prebuild).
      # Optional: host player.html on R2 separately.

      - name: Vite production build
        env:
          # 12 GB heap + 24G swap — full R3F/Monaco/Rapier graph OOMs under 8 GB
          NODE_OPTIONS: --max-old-space-size=12288
          BASE_PATH: /
          # Keep transform workers low so peak RSS stays under swap
          UV_THREADPOOL_SIZE: "2"
        # Use `exec vite` (not `run build`) so package.json prebuild is skipped.
        run: |
          free -h
          pnpm --filter @workspace/game-forge exec vite build --config vite.config.ts
          free -h

      - name: Verify dist
        run: |
          test -f artifacts/game-forge/dist/public/index.html
          grep -q 'id="root"' artifacts/game-forge/dist/public/index.html
          grep -E 'type="module".*assets/' artifacts/game-forge/dist/public/index.html
          # SPA rewrites are mandatory — without them /editor 404s on Vercel
          test -f artifacts/game-forge/dist/public/vercel.json
          grep -q 'rewrites' artifacts/game-forge/dist/public/vercel.json
          # Hybrid C# packs — Blazor WASM must ship with the SPA
          test -f artifacts/game-forge/dist/public/_framework/blazor.boot.json
          test -f artifacts/game-forge/dist/public/_framework/GameForgeRuntime.wasm
          test -f artifacts/game-forge/dist/public/_framework/dotnet.js
          # Builtin GLBs must not ship (R2 only)
          if [ -d artifacts/game-forge/dist/public/builtin ]; then
            echo "ERROR: dist/public/builtin must be stripped" >&2
            exit 1
          fi
          du -sh artifacts/game-forge/dist/public
          ls -la artifacts/game-forge/dist/public/assets | head
          ls artifacts/game-forge/dist/public/_framework | head

      - name: Install Vercel CLI
        run: npm i -g vercel@latest

      - name: Link dist to grudge-studio-forge (never public)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::error::Missing VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID secrets"
            exit 1
          fi
          mkdir -p artifacts/game-forge/dist/public/.vercel
          cat > artifacts/game-forge/dist/public/.vercel/project.json <<EOF
          {"projectId":"$VERCEL_PROJECT_ID","orgId":"$VERCEL_ORG_ID","projectName":"grudge-studio-forge"}
          EOF
          cat artifacts/game-forge/dist/public/.vercel/project.json

      - name: Deploy prebuilt SPA to production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          cd artifacts/game-forge/dist/public
          test -f vercel.json
          vercel deploy --prod --yes --token="$VERCEL_TOKEN" --scope grudgenexus

      - name: Smoke production after deploy
        if: success()
        run: |
          sleep 30
          node scripts/smoke-forge-prod.mjs
        env:
          FORGE_BASE: https://forge.grudge-studio.com
        continue-on-error: true
