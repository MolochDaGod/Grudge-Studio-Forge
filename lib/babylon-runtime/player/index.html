<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grudge GameForge — Babylon Player</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0a14; }
    #canvas { width: 100%; height: 100%; display: block; touch-action: none; }
    #loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #0a0a14; color: #d4a84b; font-family: system-ui, sans-serif;
      z-index: 100; transition: opacity 0.4s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading h1 { font-size: 20px; font-weight: 700; margin-bottom: 8px; }
    #loading p { font-size: 13px; color: #8b8685; }
    #error {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      background: #2a1010; border: 1px solid #ff4d4d; color: #ff8888;
      padding: 10px 20px; border-radius: 8px; font-size: 12px;
      font-family: monospace; max-width: 600px; display: none; z-index: 100;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>Grudge GameForge</h1>
    <p>Loading scene…</p>
  </div>
  <div id="error"></div>
  <canvas id="canvas"></canvas>
  <script type="module" src="./main.ts"></script>
</body>
</html>
