openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Grudge GameForge API — projects, scenes, scripts, assets, and Grudge Studio data proxy
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
    description: Grudge Studio Puter sign-in, session, and identity endpoints.
  - name: projects
  - name: scenes
  - name: scripts
  - name: assets
  - name: prefabs
  - name: grudge
  - name: storage
    description: Object storage upload and serving endpoints.
paths:
  /storage/uploads/request-url:
    post:
      tags: [storage]
      operationId: requestUploadUrl
      summary: Request a presigned URL for file upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UploadUrlRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadUrlResponse'
        '400':
          description: Missing or invalid required fields.
        '500':
          description: Failed to generate upload URL.

  /storage/public-objects/{filePath}:
    get:
      tags: [storage]
      operationId: getPublicObject
      summary: Serve a public asset
      parameters:
        - name: filePath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: File not found.

  /storage/objects/{objectPath}:
    get:
      tags: [storage]
      operationId: getStorageObject
      summary: Serve an uploaded object entity
      parameters:
        - name: objectPath
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: string
                format: binary
        '404':
          description: Object not found.

  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/config:
    get:
      operationId: getAuthConfig
      tags: [auth]
      summary: Public auth bootstrap config
      description: |
        Returns the front-end SDK bootstrap config. Safe to call
        unauthenticated; never includes secrets.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthConfig"

  /auth/puter/sync:
    post:
      operationId: syncPuterUser
      tags: [auth]
      summary: Mirror a signed-in Puter user into the shared Grudge users table
      description: |
        Verifies a Puter access token server-to-server (via Puter's
        `whoami` endpoint), upserts the shared `users` row keyed on
        `puter_uuid`, and returns the resolved user view (including
        the canonical Grudge ID when one exists in the upstream
        `grudge_accounts` registry, or a deterministic per-user
        ephemeral id otherwise).

        Forge holds no server-side session — Puter Auth manages its
        own token lifecycle entirely client-side via the Puter SDK.
        This endpoint is idempotent and intended to be called once
        per app boot when the SDK reports a signed-in user.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PuterSyncRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PuterSyncResponse"
        "400":
          description: Missing or malformed Puter access token.
        "401":
          description: Puter rejected the access token.
        "502":
          description: Puter API was unreachable or returned an unexpected response.

  /projects:
    get:
      operationId: listProjects
      tags: [projects]
      summary: List all projects
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Project"
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a new project
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProjectBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"

  /projects/{id}:
    get:
      operationId: getProject
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
        "404":
          description: Not Found
    patch:
      operationId: updateProject
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProjectBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Project"
    delete:
      operationId: deleteProject
      tags: [projects]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /projects/{id}/summary:
    get:
      operationId: getProjectSummary
      tags: [projects]
      summary: Aggregated stats for a project
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProjectSummary"

  /projects/{id}/scenes:
    get:
      operationId: listScenes
      tags: [scenes]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Scene"

  /scenes:
    post:
      operationId: createScene
      tags: [scenes]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSceneBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"

  /scenes/{id}:
    get:
      operationId: getScene
      tags: [scenes]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
        "404":
          description: Not Found
    patch:
      operationId: updateScene
      tags: [scenes]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSceneBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Scene"
    delete:
      operationId: deleteScene
      tags: [scenes]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /projects/{id}/scripts:
    get:
      operationId: listScripts
      tags: [scripts]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Script"

  /scripts:
    post:
      operationId: createScript
      tags: [scripts]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateScriptBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"

  /scripts/{id}:
    get:
      operationId: getScript
      tags: [scripts]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"
        "404":
          description: Not Found
    patch:
      operationId: updateScript
      tags: [scripts]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateScriptBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Script"
    delete:
      operationId: deleteScript
      tags: [scripts]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /projects/{id}/assets:
    get:
      operationId: listAssets
      tags: [assets]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Asset"

  /assets:
    post:
      operationId: createAsset
      tags: [assets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAssetBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Asset"

  /assets/{id}:
    delete:
      operationId: deleteAsset
      tags: [assets]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /projects/{id}/prefabs:
    get:
      operationId: listPrefabs
      tags: [prefabs]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Prefab"

  /prefabs:
    post:
      operationId: createPrefab
      tags: [prefabs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePrefabBody"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefab"

  /prefabs/{id}:
    get:
      operationId: getPrefab
      tags: [prefabs]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefab"
    put:
      operationId: updatePrefab
      tags: [prefabs]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdatePrefabBody"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Prefab"
    delete:
      operationId: deletePrefab
      tags: [prefabs]
      parameters:
        - $ref: "#/components/parameters/IdParam"
      responses:
        "204":
          description: Deleted

  /grudge/weapons:
    get:
      operationId: getGrudgeWeapons
      tags: [grudge]
      summary: Proxy to Grudge Studio weapons database
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrudgeCatalog"

  /grudge/items:
    get:
      operationId: getGrudgeItems
      tags: [grudge]
      summary: Proxy to Grudge Studio items database
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrudgeCatalog"

  /grudge/enemies:
    get:
      operationId: getGrudgeEnemies
      tags: [grudge]
      summary: Proxy to Grudge Studio enemy templates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrudgeCatalog"

  /grudge/quests:
    get:
      operationId: getGrudgeQuests
      tags: [grudge]
      summary: Proxy to Grudge Studio quests
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GrudgeCatalog"

components:
  parameters:
    IdParam:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    AuthConfig:
      type: object
      required: [puterSiteOrigin, puterBasePath, enablePuterCloud, grudgeAuthUrl]
      properties:
        puterSiteOrigin:
          type: string
          description: Origin the front-end loads the Puter SDK from.
        puterBasePath:
          type: string
          description: Per-app sub-folder used for Puter cloud-storage scoping.
        enablePuterCloud:
          type: boolean
          description: Whether the editor should expose Puter cloud-storage UI.
        grudgeAuthUrl:
          type: string
          nullable: true
          description: Optional URL of the upstream Grudge auth dashboard.

    GrudgeUser:
      type: object
      required:
        - userId
        - puterUuid
        - grudgeId
        - username
        - displayName
        - email
        - avatarUrl
        - hasGrudgeAccount
      properties:
        userId:
          type: string
          description: Primary key of the shared `users` row.
        puterUuid:
          type: string
        grudgeId:
          type: string
          description: |
            Either the upstream `grudge_accounts.grudge_id` when the user
            has a row in that registry, or a deterministic per-user
            ephemeral id of the form `GRUDGE-<13digits>-<HEX>` so the
            editor always has *some* id to display.
        username:
          type: string
        displayName:
          type: string
          nullable: true
        email:
          type: string
          nullable: true
        avatarUrl:
          type: string
          nullable: true
        hasGrudgeAccount:
          type: boolean
          description: True iff the upstream `grudge_accounts` registry has this user.

    PuterSyncRequest:
      type: object
      required: [puterAccessToken]
      properties:
        puterAccessToken:
          type: string
          minLength: 10
          description: Access token from `puter.auth.getAccessToken()`.

    PuterSyncResponse:
      type: object
      required: [user, created, grudgeAccountLinked]
      properties:
        user:
          $ref: "#/components/schemas/GrudgeUser"
        created:
          type: boolean
          description: True iff this sync inserted a new row in `users`.
        grudgeAccountLinked:
          type: boolean
          description: True iff the upstream `grudge_accounts` row was found.

    Project:
      type: object
      required: [id, name, description, createdAt, updatedAt]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    CreateProjectBody:
      type: object
      required: [name]
      properties:
        name:
          type: string
        description:
          type: string

    UpdateProjectBody:
      type: object
      properties:
        name:
          type: string
        description:
          type: string

    ProjectSummary:
      type: object
      required: [projectId, sceneCount, scriptCount, assetCount, entityCount, lastUpdated]
      properties:
        projectId:
          type: integer
        sceneCount:
          type: integer
        scriptCount:
          type: integer
        assetCount:
          type: integer
        entityCount:
          type: integer
        lastUpdated:
          type: string

    Scene:
      type: object
      required: [id, projectId, name, data, createdAt, updatedAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        data:
          $ref: "#/components/schemas/SceneData"
        createdAt:
          type: string
        updatedAt:
          type: string

    SceneData:
      type: object
      required: [entities, environment]
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        environment:
          $ref: "#/components/schemas/Environment"

    Environment:
      type: object
      properties:
        skyColor:
          type: string
        groundColor:
          type: string
        ambientIntensity:
          type: number
        sunIntensity:
          type: number
        gravity:
          type: array
          items:
            type: number

    Entity:
      type: object
      required: [id, name, type, transform]
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum: [box, sphere, cylinder, plane, light, camera, model, empty]
        transform:
          $ref: "#/components/schemas/Transform"
        physics:
          $ref: "#/components/schemas/PhysicsComponent"
        material:
          $ref: "#/components/schemas/MaterialComponent"
        light:
          $ref: "#/components/schemas/LightComponent"
        model:
          $ref: "#/components/schemas/ModelComponent"
        scriptId:
          type: integer
          nullable: true
        parentId:
          type: string
          nullable: true
          description: Parent entity id within this scene (null/undefined → root).
        prefabId:
          type: integer
          nullable: true
          description: If this entity was instantiated from a Prefab, its id.
        collapsed:
          type: boolean
          description: UI hint — collapsed in the hierarchy tree.
        controllerKind:
          type: string
          enum: [none, thirdPerson, firstPerson]

    Transform:
      type: object
      required: [position, rotation, scale]
      properties:
        position:
          type: array
          items:
            type: number
        rotation:
          type: array
          items:
            type: number
        scale:
          type: array
          items:
            type: number

    PhysicsComponent:
      type: object
      properties:
        bodyType:
          type: string
          enum: [fixed, dynamic, kinematicPosition, kinematicVelocity]
        colliderType:
          type: string
          enum: [cuboid, ball, cylinder, trimesh]
        mass:
          type: number
        restitution:
          type: number
        friction:
          type: number

    MaterialComponent:
      type: object
      properties:
        color:
          type: string
        metalness:
          type: number
        roughness:
          type: number
        emissive:
          type: string

    LightComponent:
      type: object
      properties:
        kind:
          type: string
          enum: [point, directional, spot]
        color:
          type: string
        intensity:
          type: number
        distance:
          type: number

    ModelComponent:
      type: object
      properties:
        url:
          type: string
        assetId:
          type: integer

    CreateSceneBody:
      type: object
      required: [projectId, name]
      properties:
        projectId:
          type: integer
        name:
          type: string
        data:
          $ref: "#/components/schemas/SceneData"

    UpdateSceneBody:
      type: object
      properties:
        name:
          type: string
        data:
          $ref: "#/components/schemas/SceneData"

    Script:
      type: object
      required: [id, projectId, name, language, code, createdAt, updatedAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        language:
          type: string
          enum: [js, ts, cs]
        code:
          type: string
        createdAt:
          type: string
        updatedAt:
          type: string

    CreateScriptBody:
      type: object
      required: [projectId, name, language]
      properties:
        projectId:
          type: integer
        name:
          type: string
        language:
          type: string
          enum: [js, ts, cs]
        code:
          type: string

    UpdateScriptBody:
      type: object
      properties:
        name:
          type: string
        code:
          type: string

    Asset:
      type: object
      required: [id, projectId, name, url, type, source, createdAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        url:
          type: string
        type:
          type: string
          enum: [model, texture, audio, image, other]
        source:
          type: string
          enum: [grudge, polyhaven, upload, url]
        createdAt:
          type: string

    CreateAssetBody:
      type: object
      required: [projectId, name, url, type, source]
      properties:
        projectId:
          type: integer
        name:
          type: string
        url:
          type: string
        type:
          type: string
          enum: [model, texture, audio, image, other]
        source:
          type: string
          enum: [grudge, polyhaven, upload, url]

    Prefab:
      type: object
      required: [id, projectId, name, data, createdAt, updatedAt]
      properties:
        id:
          type: integer
        projectId:
          type: integer
        name:
          type: string
        data:
          $ref: "#/components/schemas/PrefabData"
        createdAt:
          type: string
        updatedAt:
          type: string

    PrefabData:
      type: object
      required: [entities]
      properties:
        entities:
          type: array
          items:
            $ref: "#/components/schemas/Entity"
        rootId:
          type: string
          nullable: true

    CreatePrefabBody:
      type: object
      required: [projectId, name]
      properties:
        projectId:
          type: integer
        name:
          type: string
        data:
          $ref: "#/components/schemas/PrefabData"

    UpdatePrefabBody:
      type: object
      properties:
        name:
          type: string
        data:
          $ref: "#/components/schemas/PrefabData"

    GrudgeCatalog:
      type: object
      required: [items, source]
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        source:
          type: string

    UploadUrlRequest:
      type: object
      required: [name, size, contentType]
      properties:
        name:
          type: string
          minLength: 1
        size:
          type: integer
          minimum: 1
          maximum: 1073741824
          description: File size in bytes. Max 1 GB.
        contentType:
          type: string
          minLength: 1
        projectId:
          type: integer
          description: Optional project the file belongs to. Used to organize the storage key as uploads/<projectId>/...
        assetType:
          type: string
          enum: [model, image, audio, texture, other]
          description: Optional asset class. Used as a sub-folder in the storage key.

    UploadUrlResponse:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
        metadata:
          $ref: '#/components/schemas/UploadUrlRequest'
