# nginx origin for Grudge Studio Forge SPA
# Install on VPS as e.g. /etc/nginx/sites-available/forge-origin
#
# Cloudflare DNS (optional subdomain for the raw origin):
#   forge-origin  A/AAAA  <vps-ip>   (proxied orange cloud ON)
#   OR keep forge.grudge-studio.com on the Worker and only use this as ORIGIN target.
#
# TLS: Cloudflare Full (strict) + origin cert, or certbot if not proxied.
#
# CRITICAL: try_files must serve real files (builtin/*.glb, downloads.html,
# player.html) BEFORE SPA fallback. Otherwise demos 404 and downloads becomes
# index.html.

server {
    listen 80;
    listen [::]:80;
    server_name forge-origin.grudge-studio.com;

    root /var/www/forge-origin;
    index index.html;

    # Long-cache hashed Vite assets
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Builtin GLBs + static template JSON (must not fall through to SPA)
    location /builtin/ {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=86400";
        types {
            model/gltf-binary glb;
            application/json json;
        }
    }

    location = /downloads.html {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    location = /player.html {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=300";
    }

    # SPA shell for editor routes
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}

# Uncomment for Full (strict) with Cloudflare origin certs:
