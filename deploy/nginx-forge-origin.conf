# nginx origin for Grudge Studio Forge SPA
# Install on VPS as e.g. /etc/nginx/sites-available/forge-origin
#
# Cloudflare DNS (optional subdomain for the raw origin):
#   forge-origin  A/AAAA  <vps-ip>   (proxied orange cloud ON)
#   OR keep forge.grudge-studio.com on the Worker and only use this as ORIGIN target.
#
# TLS: Cloudflare Full (strict) + origin cert, or certbot if not proxied.

server {
    listen 80;
    listen [::]:80;
    server_name forge-origin.grudge-studio.com;

    # If Cloudflare terminates TLS and talks HTTP to origin, this is enough.
    # For Full (strict), also listen 443 with origin cert (see below).

    root /var/www/forge-origin;
    index index.html;

    # Long-cache hashed assets; never cache the SPA shell.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Health for load balancers / smoke tests
    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }
}

